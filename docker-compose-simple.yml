# Docker Compose configuration for simple single-server deployment
# Uses in-memory session storage (no Redis/Valkey required)

services:
  # PostgreSQL Database
  db:
    image: postgres:16.16-alpine3.24@sha256:0adbf25a9e96d38823bb813f3ac0ed41fadb665c88f1df7fe6dbfb060cbdc106
    container_name: jsnippets-db
    environment:
      POSTGRES_DB: jsnippets
      POSTGRES_USER: jsnippets
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jsnippets-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jsnippets"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # JSnippets Application
  app:
    image: jsnippets:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
        APP_VERSION: ${APP_VERSION:-unknown}
        VCS_REF: ${VCS_REF:-unknown}
        CACHEBUST: ${CACHEBUST:-1}
    container_name: jsnippets-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}

      # Database Configuration
      PG_HOST: db
      PG_PORT: 5432
      PG_DB: jsnippets
      PG_USER: jsnippets
      PG_PASS: ${DB_PASSWORD:-password}

      # Session Storage Configuration
      # Use in-memory sessions (suitable for single-server deployments)
      SESSION_STORE_TYPE: none
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}

      # JVM Options (can be overridden)
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jsnippets-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/actuator/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 1024M

networks:
  jsnippets-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
